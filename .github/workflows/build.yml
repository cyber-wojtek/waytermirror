name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
    - name: Install dependencies
      run: |
        pacman -Syu --noconfirm
        pacman -S --noconfirm --needed \
          base-devel \
          git \
          gcc \
          wayland \
          wayland-protocols \
          libinput \
          pipewire \
          lz4 \
          rapidjson \
          systemd \
          argparse \
          opus \
          opusfile \
          libsixel \
          libdrm mesa ffmpeg x265 meson wayland-protocols wlr-protocols

    - uses: actions/checkout@v4

    - name: Build (CPU-only)
      run: meson setup builddir && meson compile -C builddir

    - name: Verify binaries
      run: |
        ls -lah builddir/waytermirror_server builddir/waytermirror_client

  build-debian:
    runs-on: ubuntu-latest
    container:
      image: debian:13

    steps:
    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y \
          build-essential \
          git \
          gcc \
          libwayland-dev \
          wayland-protocols \
          libinput-dev \
          libpipewire-0.3-dev \
          liblz4-dev \
          rapidjson-dev \
          libsystemd-dev \
          cmake \
          pkg-config \
          libargparse-dev \
          libopus-dev \
          libopusfile-dev libsixel-dev ffmpeg libdrm-dev libgbm-dev libavcodec-dev libavutil-dev libswscale-dev libpng-dev libx265-dev meson libwlroots-0.18-dev

    - uses: actions/checkout@v4

    - name: Build (CPU-only)
      run: meson setup builddir && meson compile -C builddir

    - name: Verify binaries
      run: |
        ls -lah builddir/waytermirror_server builddir/waytermirror_client
